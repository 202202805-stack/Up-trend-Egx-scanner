name: Up Trend EGX Market Scan & Backtest

on:
  schedule:
    - cron: '0 13 * * 0-4' # تشغيل تلقائي يومي لـ runner.py
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'اختر نوع التشغيل'
        required: true
        default: 'daily_scan'
        type: choice
        options:
          - daily_scan (runner.py)
          - backtest_10y (backtest_10year_runner.py)

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install TA-Lib-precompiled || pip install ta-lib
          pip install yfinance pandas numpy scipy openpyxl tqdm requests

      # 1. تشغيل الفحص اليومي المعتاد
      - name: Run Daily Master Scanner
        if: "${{ github.event_name == 'schedule' || inputs.run_mode == 'daily_scan (runner.py)' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner.py

      # 2. تشغيل باك تيست 10 سنوات
      - name: Run 10-Year Backtest Scanner
        if: "${{ inputs.run_mode == 'backtest_10y (backtest_10year_runner.py)' }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
         run: python backtest_10y_runner.py
