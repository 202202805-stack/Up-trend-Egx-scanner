name: Up Trend EGX Market Scan

on:
  schedule:
    - cron: '0 13 * * 0-4' # تشغيل تلقائي من الأحد للخميس الساعة 3 مساءً بتوقيت مصر
  workflow_dispatch: # إمكانية التشغيل اليدوي

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install TA-Lib-precompiled || pip install ta-lib
          pip install yfinance pandas numpy scipy openpyxl tqdm requests

      - name: Run Master Scanner & Telegram Notifier
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner.py
